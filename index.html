<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Remember</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Fruit Pattern Animation */
        body::before {
            content: "🍎 🍌 🍇 🍉 🍓 🍒 🍍 🥝 🍑 🥭 🍋 🍊";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 3rem;
            opacity: 0.08;
            z-index: -1;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            overflow: hidden;
            pointer-events: none;
            justify-content: center;
            align-content: center;
        }

        .phone-frame {
            background: #111;
            border: 12px solid #333;
            border-radius: 40px;
            width: 100%;
            max-width: 420px;
            min-height: 85vh;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 15px 10px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        h1 {
            margin: 10px 0 15px 0;
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: #ffeb3b;
            text-shadow: 3px 3px 0px #ff9800, 5px 5px 10px rgba(0,0,0,0.5);
            transform: rotate(-3deg);
            text-align: center;
        }

        /* Splash Screen Style */
        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            text-align: center;
            gap: 15px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffeb3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #ff9800;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        button:hover {
            background: #f57c00;
            transform: scale(1.05);
        }

        /* Ludo Style Player Box with Circular Timer */
        .player-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
            padding: 8px 15px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            transition: 0.3s;
        }

        .player-box.active-turn {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.15);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            font-size: 1.5rem;
            background: #222;
            padding: 5px 10px;
            border-radius: 50%;
            border: 2px solid #555;
        }

        .player-details span {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .player-details small {
            font-size: 0.75rem;
            color: #aaa;
        }

        /* Circular Timer UI */
        .timer-circle {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: conic-gradient(#00e676 360deg, #333 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-inner {
            width: 30px;
            height: 30px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
        }

        .grid-container {
            display: grid;
            gap: 6px;
            max-width: 100%;
            justify-content: center;
            margin: 5px 0;
        }

        .card {
            background-color: #ffffff;
            color: #000;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .card.flipped, .card.matched {
            background-color: #fff;
        }

        .hidden {
            display: none !important;
        }

        #winMessage {
            font-size: 1.2rem;
            margin: 10px 0;
            color: #00e676;
            font-weight: bold;
            text-align: center;
        }

        /* Top Bar inside Game */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-bottom: 5px;
        }

        /* Exit Custom Modal Popup */
        #exitModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-box {
            background: #222;
            border: 2px solid #444;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-box p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .modal-buttons button {
            padding: 8px 18px;
            font-size: 1rem;
        }

        /* Network Modal Error */
        #networkModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- Network Offline Modal -->
        <div id="networkModal" class="hidden">
            <h2>Connection Failed</h2>
            <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 20px;">Please check your internet connection.</p>
            <button onclick="checkConnection()">Retry</button>
        </div>

        <!-- Exit Confirmation Modal -->
        <div id="exitModal" class="hidden">
            <div class="modal-box">
                <p>Are sure to exit?</p>
                <div class="modal-buttons">
                    <button onclick="confirmExit()" style="background: #e53935;">OK</button>
                    <button onclick="closeExitModal()" style="background: #555;">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Splash / Loading Screen -->
        <div class="splash-screen" id="splashScreen">
            <h1 style="font-size: 3rem;">Fruit Remember</h1>
            <p style="color: #ddd; font-size: 0.95rem;">Loading your game...</p>
            <div class="loader"></div>
        </div>

        <!-- Game Menu Screen -->
        <div class="menu hidden" id="menuScreen">
            <h1>Fruit Remember</h1>
            <div style="display: flex; flex-direction: column; gap: 12px; width: 80%; margin-top: 15px;">
                <button onclick="startGame('easy')">Easy (4x4)</button>
                <button onclick="startGame('medium')">Medium (6x6)</button>
                <button onclick="startGame('hard')">Hard (8x8)</button>
            </div>
        </div>

        <!-- In-Game Container (Hidden initially) -->
        <div id="gameContainer" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; justify-content: space-between;">
            
            <!-- Top Bar with Exit Button -->
            <div class="game-top-bar">
                <span style="font-size: 0.9rem; color: #ffeb3b; font-weight: bold;">Match the Fruits</span>
                <button onclick="showExitModal()" style="padding: 5px 12px; font-size: 0.8rem; background: #e53935;">Exit</button>
            </div>

            <!-- Player 1 Box (Top) -->
            <div id="player1Box" class="player-box active-turn">
                <div class="player-info">
                    <div class="player-avatar">👦</div>
                    <div class="player-details">
                        <span>Player 1</span>
                        <small id="p1ScoreText">Score: 0</small>
                    </div>
                </div>
                <div class="timer-circle" id="p1TimerCircle">
                    <div class="timer-inner" id="p1Timer">10</div>
                </div>
            </div>

            <!-- Game Grid -->
            <div class="grid-container" id="gridContainer"></div>

            <!-- Player 2 Box (Bottom) -->
            <div id="player2Box" class="player-box">
                <div class="player-info">
                    <div class="player-avatar">👦</div>
                    <div class="player-details">
                        <span>Player 2</span>
                        <small id="p2ScoreText">Score: 0</small>
                    </div>
                </div>
                <div class="timer-circle" id="p2TimerCircle">
                    <div class="timer-inner" id="p2Timer">10</div>
                </div>
            </div>

            <div id="winMessage"></div>
        </div>

    </div>

    <script>
        const fruits = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍍', '🥝', '🍑', '🥭', '🍋', '🍊', '🍐', '🍏', '🍈', '🥥', '🍅', '🥑', '🍆', '🥔', '🥕', '🌽', '🌶️', '🥒', '🥬', '🥦', '🧄', '🧅', '🍄', '🥜', '🌰', '🍞'];
        
        let currentMode = 'easy';
        let boardSize = 4;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 8;
        
        let p1Score = 0;
        let p2Score = 0;
        let currentPlayer = 1;
        let isLocked = false;

        let timeLeft = 10;
        let timerInterval = null;

        // Network Checker
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        function updateNetworkStatus() {
            const modal = document.getElementById('networkModal');
            if (!navigator.onLine) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function checkConnection() {
            if (navigator.onLine) {
                document.getElementById('networkModal').classList.add('hidden');
            } else {
                alert("Still offline!");
            }
        }

        // App Launch Splash Timer (2 seconds delay)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('hidden');
                document.getElementById('menuScreen').classList.remove('hidden');
            }, 2000);
        });

        function startGame(mode) {
            currentMode = mode;
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('winMessage').innerText = '';

            p1Score = 0;
            p2Score = 0;
            currentPlayer = 1;
            matchedPairs = 0;
            updateScoreboard();

            if (mode === 'easy') {
                boardSize = 4;
                totalPairs = 8;
            } else if (mode === 'medium') {
                boardSize = 6;
                totalPairs = 18;
            } else {
                boardSize = 8;
                totalPairs = 32;
            }

            setupGrid();
            startTimer();
        }

        // Timer Functions
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearFlippedOnTimeout();
                    switchTurn();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const p1TimerEl = document.getElementById('p1Timer');
            const p2TimerEl = document.getElementById('p2Timer');
            const p1Circle = document.getElementById('p1TimerCircle');
            const p2Circle = document.getElementById('p2TimerCircle');

            let degree = (timeLeft / 10) * 360;

            if (currentPlayer === 1) {
                p1TimerEl.innerText = timeLeft;
                p1Circle.style.background = `conic-gradient(#00e676 ${degree}deg, #333 0deg)`;
                p2TimerEl.innerText = "10";
                p2Circle.style.background = `conic-gradient(#00e676 360deg, #333 0deg)`;
            } else {
                p2TimerEl.innerText = timeLeft;
                p2Circle.style.background = `conic-gradient(#00e676 ${degree}deg, #333 0deg)`;
                p1TimerEl.innerText = "10";
                p1Circle.style.background = `conic-gradient(#00e676 360deg, #333 0deg)`;
            }
        }

        function switchTurn() {
            if (flippedCards.length === 1) {
                let singleCard = flippedCards[0].element;
                singleCard.innerText = '';
                singleCard.classList.remove('flipped');
                flippedCards = [];
            }

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateScoreboard();
            isLocked = false;
            startTimer();
        }

        function clearFlippedOnTimeout() {
            if (flippedCards.length === 1) {
                let card = flippedCards[0].element;
                card.innerText = '';
                card.classList.remove('flipped');
                flippedCards = [];
            }
        }

        // Exit Modal Functions
        function showExitModal() {
            clearInterval(timerInterval);
            document.getElementById('exitModal').classList.remove('hidden');
        }

        function closeExitModal() {
            document.getElementById('exitModal').classList.add('hidden');
            if (!document.getElementById('gameContainer').classList.contains('hidden') && matchedPairs < totalPairs) {
                startTimer();
            }
        }

        function confirmExit() {
            clearInterval(timerInterval);
            document.getElementById('exitModal').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('gridContainer').innerHTML = '';
            document.getElementById('winMessage').innerText = '';
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        function setupGrid() {
            const container = document.getElementById('gridContainer');
            container.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            
            let cardSizePx, fontSizePx;
            if (boardSize === 4) {
                cardSizePx = '58px';
                fontSizePx = '1.6rem';
            } else if (boardSize === 6) {
                cardSizePx = '38px';
                fontSizePx = '1.2rem';
            } else {
                cardSizePx = '28px';
                fontSizePx = '0.9rem';
            }

            let selectedFruits = fruits.slice(0, totalPairs);
            let gameFruits = [...selectedFruits, ...selectedFruits];
            gameFruits.sort(() => Math.random() - 0.5);

            container.innerHTML = '';
            cards = gameFruits.map((fruit, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.style.width = cardSizePx;
                card.style.height = cardSizePx;
                card.style.fontSize = fontSizePx;
                card.dataset.fruit = fruit;
                card.dataset.index = index;
                
                card.addEventListener('click', () => flipCard(card, fruit));
                container.appendChild(card);
                return card;
            });
        }

        function flipCard(card, fruit) {
            if (isLocked) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length === 1 && flippedCards[0].element === card) return;

            card.innerText = fruit;
            card.classList.add('flipped');
            flippedCards.push({ element: card, fruit: fruit });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            clearInterval(timerInterval);
            const [first, second] = flippedCards;

            if (first.fruit === second.fruit) {
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                matchedPairs++;

                if (currentPlayer === 1) p1Score++;
                else p2Score++;
                updateScoreboard();

                resetTurnState();

                if (matchedPairs === totalPairs) {
                    declareWinner();
                } else {
                    isLocked = false;
                    startTimer();
                }
            } else {
                setTimeout(() => {
                    first.element.innerText = '';
                    first.element.classList.remove('flipped');
                    second.element.innerText = '';
                    second.element.classList.remove('flipped');
                    
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    updateScoreboard();
                    resetTurnState();
                    isLocked = false;
                    startTimer();
                }, 900);
            }
        }

        function resetTurnState() {
            flippedCards = [];
        }

        function updateScoreboard() {
            const p1Box = document.getElementById('player1Box');
            const p2Box = document.getElementById('player2Box');
            
            document.getElementById('p1ScoreText').innerText = `Score: ${p1Score}`;
            document.getElementById('p2ScoreText').innerText = `Score: ${p2Score}`;

            if (currentPlayer === 1) {
                p1Box.classList.add('active-turn');
                p2Box.classList.remove('active-turn');
            } else {
                p2Box.classList.add('active-turn');
                p1Box.classList.remove('active-turn');
            }
        }

        function declareWinner() {
            clearInterval(timerInterval);
            const msg = document.getElementById('winMessage');
            if (p1Score > p2Score) {
                msg.innerText = "🎉 Player 1 Wins!";
            } else if (p2Score > p1Score) {
                msg.innerText = "🎉 Player 2 Wins!";
            } else {
                msg.innerText = "🤝 It's a Tie!";
            }
        }
    </script>
</body>
</html>
