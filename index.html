<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fruit Remember</title>
  
  <!-- AdSense Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3711405849292009" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #8E2DE2, #4A00E0);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    #game-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    h1 {
      font-size: 26px;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .difficulty-btn {
      background: #FF416C;
      background: -webkit-linear-gradient(to right, #FF4B2B, #FF416C);
      background: linear-gradient(to right, #FF4B2B, #FF416C);
      border: none;
      color: white;
      padding: 8px 15px;
      margin: 3px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .difficulty-btn.active {
      background: #00b09b;
      box-shadow: 0 0 10px #00b09b;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      margin: 15px 0;
      background: rgba(0,0,0,0.2);
      padding: 10px 15px;
      border-radius: 12px;
    }
    #grid {
      display: grid;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
    }
    .grid-easy { grid-template-columns: repeat(3, 1fr); }
    .grid-medium { grid-template-columns: repeat(4, 1fr); }
    .grid-hard { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: #ffffff;
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      transform-style: preserve-3d;
    }
    .card.flipped {
      transform: rotateY(180deg);
      background: #fff;
    }
    .card.matched {
      background: #2ecc71;
      cursor: default;
      animation: pulse 0.5s;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .main-btn {
      background: #11998e;
      background: linear-gradient(to right, #38ef7d, #11998e);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin-top: 5px;
    }
    /* Offline Modal */
    #offline-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #fff;
      color: #333;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>🍉 Fruit Remember 🍇</h1>

    <!-- Difficulty Modes -->
    <div id="difficulty-selection">
      <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy (3x2)</button>
      <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium (4x3)</button>
      <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard (4x4)</button>
    </div>
    
    <div class="stats-bar">
      <div>Score: <span id="score">0</span></div>
      <div>Moves: <span id="moves">0</span></div>
    </div>
    
    <div id="grid" class="grid-easy"></div>
    
    <button class="main-btn" onclick="restartGame()">Restart Game</button>
  </div>

  <!-- Offline Notice -->
  <div id="offline-modal">
    <div class="modal-content">
      <h2>⚠️ Internet Disconnected</h2>
      <p style="margin-top: 10px;">Please connect to the internet to continue.</p>
    </div>
  </div>

  <script>
    const allFruits = ['🍎', '🍌', '🍇', '🍊', '🍉', '🍓', '🥑', '🍍'];
    let currentDifficulty = 'easy';
    let cardsArray = [];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let score = 0;
    let moves = 0;

    function setDifficulty(level) {
      currentDifficulty = level;
      document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      restartGame();
    }

    function prepareCards() {
      let count = 3; // Easy default (3 pairs = 6 cards)
      const grid = document.getElementById('grid');
      grid.className = '';

      if (currentDifficulty === 'easy') {
        count = 3;
        grid.classList.add('grid-easy');
      } else if (currentDifficulty === 'medium') {
        count = 6;
        grid.classList.add('grid-medium');
      } else if (currentDifficulty === 'hard') {
        count = 8;
        grid.classList.add('grid-hard');
      }

      const selectedFruits = allFruits.slice(0, count);
      cardsArray = [...selectedFruits, ...selectedFruits];
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function createBoard() {
      prepareCards();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const shuffledCards = shuffle(cardsArray);
      
      shuffledCards.forEach((fruit) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.fruit = fruit;
        card.innerText = '❓';
        card.addEventListener('click', flipCard);
        grid.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;

      this.classList.add('flipped');
      this.innerText = this.dataset.fruit;

      if (!firstCard) {
        firstCard = this;
        return;
      }

      secondCard = this;
      moves++;
      document.getElementById('moves').innerText = moves;
      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.fruit === secondCard.dataset.fruit;
      isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      score += 10;
      document.getElementById('score').innerText = score;
      resetBoard();

      if (document.querySelectorAll('.matched').length === cardsArray.length) {
        setTimeout(() => alert(`🎉 BINGO! You won in ${moves} moves!`), 300);
      }
    }

    function unflipCards() {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        firstCard.innerText = '❓';
        secondCard.innerText = '❓';
        resetBoard();
      }, 700);
    }

    function resetBoard() {
      [firstCard, secondCard] = [null, null];
      [lockBoard] = [false];
    }

    function restartGame() {
      score = 0;
      moves = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('moves').innerText = moves;
      resetBoard();
      createBoard();
    }

    // Offline Detector
    window.addEventListener('offline', () => {
      document.getElementById('offline-modal').style.display = 'flex';
    });
    window.addEventListener('online', () => {
      document.getElementById('offline-modal').style.display = 'none';
    });
    if (!navigator.onLine) {
      document.getElementById('offline-modal').style.display = 'flex';
    }

    // Direct Start
    createBoard();
  </script>
</body>
</html>
