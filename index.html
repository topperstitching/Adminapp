<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fruit Remember</title>
  
  <!-- AdSense Script (बिना अप्रूवल के शांत रहेगा) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1051939103390028" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74b9ff, #a29bfe);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      width: 90%;
      max-width: 400px;
      position: relative;
    }
    h1 {
      font-size: 24px;
      color: #6c5ce7;
      margin-bottom: 10px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      background: #ffeaa7;
      padding: 8px;
      border-radius: 10px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .card {
      background: #74b9ff;
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, background 0.2s;
    }
    .card.flipped {
      background: #fff;
      transform: rotateY(180deg);
    }
    .card.matched {
      background: #55efc4;
      cursor: default;
    }
    button {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.4);
      transition: background 0.2s;
    }
    button:hover {
      background: #5649c0;
    }
    /* Offline Modal */
    #offline-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>🍉 Fruit Remember 🍇</h1>
    <div class="stats-bar">
      <div>Score: <span id="score">0</span></div>
      <div>Moves: <span id="moves">0</span></div>
    </div>
    
    <div id="grid"></div>
    
    <button onclick="restartGame()">Restart Game</button>
  </div>

  <!-- Offline Notice Modal -->
  <div id="offline-modal">
    <div class="modal-content">
      <h2>⚠️ Internet Disconnected</h2>
      <p style="margin: 10px 0;">Please connect to the internet to continue playing.</p>
    </div>
  </div>

  <script>
    const fruits = ['🍎', '🍌', '🍇', '🍊', '🍉', '🍓', '🥑', '🍍'];
    let cardsArray = [...fruits, ...fruits];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let score = 0;
    let moves = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function createBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const shuffledCards = shuffle(cardsArray);
      
      shuffledCards.forEach((fruit) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.fruit = fruit;
        card.innerText = '❓';
        card.addEventListener('click', flipCard);
        grid.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;

      this.classList.add('flipped');
      this.innerText = this.dataset.fruit;

      if (!firstCard) {
        firstCard = this;
        return;
      }

      secondCard = this;
      moves++;
      document.getElementById('moves').innerText = moves;
      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.fruit === secondCard.dataset.fruit;
      isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      score += 10;
      document.getElementById('score').innerText = score;
      resetBoard();

      if (document.querySelectorAll('.matched').length === cardsArray.length) {
        setTimeout(() => alert(`🎉 Congratulations! You won in ${moves} moves!`), 300);
      }
    }

    function unflipCards() {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        firstCard.innerText = '❓';
        secondCard.innerText = '❓';
        resetBoard();
      }, 800);
    }

    function resetBoard() {
      [firstCard, secondCard] = [null, null];
      [lockBoard] = [false];
    }

    function restartGame() {
      score = 0;
      moves = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('moves').innerText = moves;
      resetBoard();
      createBoard();
    }

    // Internet Status Monitoring
    window.addEventListener('offline', () => {
      document.getElementById('offline-modal').style.display = 'flex';
    });

    window.addEventListener('online', () => {
      document.getElementById('offline-modal').style.display = 'none';
    });

    if (!navigator.onLine) {
      document.getElementById('offline-modal').style.display = 'flex';
    }

    // Start Game Directly
    createBoard();
  </script>
</body>
</html>
