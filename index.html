<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Remember</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 1.8rem;
            text-align: center;
        }

        .menu, .game-info {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ff9800;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        button:hover {
            background: #f57c00;
            transform: scale(1.05);
        }

        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 10px;
        }

        .active-turn {
            border-bottom: 3px solid #00e676;
            color: #00e676;
        }

        .grid-container {
            display: grid;
            gap: 10px;
            max-width: 100%;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            transform-style: preserve-3d;
        }

        .card.flipped, .card.matched {
            background-color: #fff;
        }

        .hidden {
            display: none;
        }

        #winMessage {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #00e676;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Fruit Remember</h1>

    <div class="menu" id="menuScreen">
        <button onclick="startGame('easy')">Easy (4x4)</button>
        <button onclick="startGame('hard')">Hard (8x8)</button>
    </div>

    <div class="game-info hidden" id="gameInfo">
        <div class="scoreboard">
            <div id="p1Score" class="active-turn">Player 1: 0</div>
            <div id="p2Score">Player 2: 0</div>
        </div>
        <button onclick="returnToMenu()">Menu</button>
    </div>

    <div class="grid-container" id="gridContainer"></div>
    <div id="winMessage"></div>

    <script>
        const fruits = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍍', '🥝', '🍑', '🥭', '🍋', '🍊', '🍐', '🍏', '🍈', '🥥', '🍅', '🥑', '🍆', '🥔', '🥕', '🌽', '🌶️', '🥒', '🥬', '🥦', '🧄', '🧅', '🍄', '🥜', '🌰', '🍞'];
        
        let currentMode = 'easy';
        let boardSize = 4; // 4x4
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 8;
        
        let p1Score = 0;
        let p2Score = 0;
        let currentPlayer = 1; // 1 or 2
        let isLocked = false;

        function startGame(mode) {
            currentMode = mode;
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameInfo').classList.remove('hidden');
            document.getElementById('winMessage').innerText = '';

            p1Score = 0;
            p2Score = 0;
            currentPlayer = 1;
            matchedPairs = 0;
            updateScoreboard();

            if (mode === 'easy') {
                boardSize = 4; // 16 cards (8 pairs)
                totalPairs = 8;
            } else {
                boardSize = 8; // 64 cards (32 pairs)
                totalPairs = 32;
            }

            setupGrid();
        }

        function returnToMenu() {
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('gameInfo').classList.add('hidden');
            document.getElementById('gridContainer').innerHTML = '';
            document.getElementById('winMessage').innerText = '';
        }

        function setupGrid() {
            const container = document.getElementById('gridContainer');
            container.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            
            // Card sizing style based on mode for mobile responsiveness
            const cardSizePx = boardSize === 4 ? '70px' : '38px';
            const fontSizePx = boardSize === 4 ? '2rem' : '1.2rem';

            // Select required fruit pairs
            let selectedFruits = fruits.slice(0, totalPairs);
            let gameFruits = [...selectedFruits, ...selectedFruits];
            
            // Shuffle fruits
            gameFruits.sort(() => Math.random() - 0.5);

            container.innerHTML = '';
            cards = gameFruits.map((fruit, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.style.width = cardSizePx;
                card.style.height = cardSizePx;
                card.style.fontSize = fontSizePx;
                card.dataset.fruit = fruit;
                card.dataset.index = index;
                
                card.addEventListener('click', () => flipCard(card, fruit));
                container.appendChild(card);
                return card;
            });
        }

        function flipCard(card, fruit) {
            if (isLocked) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length === 1 && flippedCards[0].element === card) return;

            card.innerText = fruit;
            card.classList.add('flipped');
            flippedCards.push({ element: card, fruit: fruit });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            const [first, second] = flippedCards;

            if (first.fruit === second.fruit) {
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                matchedPairs++;

                // Give point to current player
                if (currentPlayer === 1) p1Score++;
                else p2Score++;
                updateScoreboard();

                resetTurnState();

                if (matchedPairs === totalPairs) {
                    declareWinner();
                }
            } else {
                // Not match: flip back after a short delay and switch player turn
                setTimeout(() => {
                    first.element.innerText = '';
                    first.element.classList.remove('flipped');
                    second.element.innerText = '';
                    second.element.classList.remove('flipped');
                    
                    // Switch turn
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    updateScoreboard();
                    resetTurnState();
                }, 900);
            }
        }

        function resetTurnState() {
            flippedCards = [];
            isLocked = false;
        }

        function updateScoreboard() {
            const p1El = document.getElementById('p1Score');
            const p2El = document.getElementById('p2Score');
            
            p1El.innerText = `Player 1: ${p1Score}`;
            p2El.innerText = `Player 2: ${p2Score}`;

            if (currentPlayer === 1) {
                p1El.classList.add('active-turn');
                p2El.classList.remove('active-turn');
            } else {
                p2El.classList.add('active-turn');
                p1El.classList.remove('active-turn');
            }
        }

        function declareWinner() {
            const msg = document.getElementById('winMessage');
            if (p1Score > p2Score) {
                msg.innerText = "🎉 Player 1 Wins!";
            } else if (p2Score > p1Score) {
                msg.innerText = "🎉 Player 2 Wins!";
            } else {
                msg.innerText = "🤝 It's a Tie!";
            }
        }
    </script>
</body>
</html>
